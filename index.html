<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuevo Testamento en 365 días</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f5f1e8;
    text-align:center;
    padding:20px;
}

.contenedor {
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
}

h1 {
    color:#7b4b2a;
}

.dia {
    font-size:28px;
    font-weight:bold;
}

.lectura {
    font-size:22px;
    margin:20px;
}

.boton {
    background:#1b6ca8;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
}

.frase {
    margin-top:30px;
    font-style:italic;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>Nuevo Testamento en 365 días</h1>

<div id="contenido"></div>

<div class="frase">
"Jesús es el camino, la verdad y la vida"
</div>

</div>


<script>

const lecturas = [
  {
    dia: 1,
    texto: "Mateo 1:1-25",
    link: "https://www.bible.com/es-ES/bible/149/MAT.1.RVR1960"
  },

  {
    dia: 2,
    texto: "Mateo 2:1-23",
    link: "https://www.bible.com/es-ES/bible/149/MAT.2.RVR1960"
  },

  {
    dia: 3,
    texto: "Mateo 3:1-17",
    link: "https://www.bible.com/es-ES/bible/149/MAT.3.RVR1960"
  },

  {
    dia: 8,
    texto: "Mateo 6:25-34 y Mateo 7:1-12",
    secciones: [
      {
        titulo: "Mateo 6",
        inicio: "25",
        fin: "34",
        url: "https://www.bible.com/es-ES/bible/149/MAT.6.RVR1960"
      },
      {
        titulo: "Mateo 7",
        inicio: "1",
        fin: "12",
        url: "https://www.bible.com/es-ES/bible/149/MAT.7.RVR1960"
      }
    ]
  }
];

let diaActual = 8;

let lectura = lecturas.find(x => x.dia === diaActual);

let contenidoBotones = "";

if (lectura.secciones) {

  contenidoBotones = lectura.secciones.map((seccion, index) => `
    <div style="
      margin:25px 0;
      padding:18px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fafafa;
    ">

      <div style="
        font-size:20px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        ${index === 0 ? "PRIMERA PARTE" : "SEGUNDA PARTE"}
      </div>

      <div style="
        font-size:19px;
        margin-bottom:8px;
      ">
        📖 ${seccion.titulo}
      </div>

      <div style="
        font-size:17px;
        margin-bottom:6px;
      ">
        Empiece en el versículo <strong>${seccion.inicio}</strong>
      </div>

      <div style="
        font-size:18px;
        font-weight:bold;
        margin-bottom:18px;
      ">
        ✅ TERMINE EN EL VERSÍCULO ${seccion.fin}
      </div>

      <a class="boton" href="${seccion.url}" target="_blank">
        ${index === 0 ? "LEER ESTA PARTE" : "CONTINUAR LECTURA"}
      </a>

    </div>
  `).join("");

} else {

  contenidoBotones = `
    <a class="boton" href="${lectura.link}" target="_blank">
      LEER LA LECTURA DE HOY
    </a>
  `;
}

document.getElementById("contenido").innerHTML = `

<div class="dia">
Día ${lectura.dia}
</div>

<div class="lectura">
📖 ${lectura.texto}
</div>

${contenidoBotones}

`;

</script>
</body>
</html>
