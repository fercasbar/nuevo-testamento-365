<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuevo Testamento en 365 días</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f5f1e8;
    text-align:center;
    padding:20px;
}

.contenedor {
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
}

h1 {
    color:#7b4b2a;
}

.dia {
    font-size:28px;
    font-weight:bold;
}

.lectura {
    font-size:22px;
    margin:20px;
}

.boton {
    background:#1b6ca8;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
}

.frase {
    margin-top:30px;
    font-style:italic;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>Nuevo Testamento en 365 días</h1>

<div id="contenido"></div>

<div class="frase">
"Jesús es el camino, la verdad y la vida"
</div>

</div>


<script>

const lecturas = [

{
dia:1,
texto:"Mateo 1:1-22",
link:"https://www.biblegateway.com/passage/?search=Mateo%201%3A1-22&version=RVR1960"
},

{
dia:2,
texto:"Mateo 1:23 - Mateo 2:22",
link:"https://www.biblegateway.com/passage/?search=Mateo%201%3A23-2%3A22&version=RVR1960"
},

{
dia:3,
texto:"Mateo 3:1-17",
link:"https://www.biblegateway.com/passage/?search=Mateo%203%3A1-17&version=RVR1960"
}

];


let diaActual = 1;

let lectura = lecturas.find(x => x.dia === diaActual);


document.getElementById("contenido").innerHTML = `

<div class="dia">
Día ${lectura.dia}
</div>

<div class="lectura">
📖 ${lectura.texto}
</div>

<a class="boton" href="${lectura.link}" target="_blank">
Leer Biblia RVR1960
</a>

`;

</script>


</body>
</html>
