<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuevo Testamento en 365 días</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f5f1e8;
    text-align:center;
    padding:20px;
}

.contenedor {
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
}

h1 {
    color:#7b4b2a;
}

.dia {
    font-size:28px;
    font-weight:bold;
}

.lectura {
    font-size:22px;
    margin:20px;
}

.boton {
    background:#1b6ca8;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
}

.frase {
    margin-top:30px;
    font-style:italic;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>Nuevo Testamento en 365 días</h1>

<div id="contenido"></div>

<div class="frase">
"Jesús es el camino, la verdad y la vida"
</div>

</div>


<script>

const lecturas = [
  {
    dia: 1,
    texto: "Mateo 1:1-25",
    link: "https://www.bible.com/es-ES/bible/149/MAT.1.RVR1960"
  },

  {
    dia: 2,
    texto: "Mateo 2:1-23",
    link: "https://www.bible.com/es-ES/bible/149/MAT.2.RVR1960"
  },

  {
    dia: 3,
    texto: "Mateo 3:1-17",
    link: "https://www.bible.com/es-ES/bible/149/MAT.3.RVR1960"
  },

  {
    dia: 4,
    texto: "Mateo 4:1-25",
    link: "https://www.bible.com/es-ES/bible/149/MAT.4.RVR1960"
  },

  {
    dia: 5,
    texto: "Mateo 5:1-24",
    link: "https://www.bible.com/es-ES/bible/149/MAT.5.RVR1960",
    aviso: "Lee desde el versículo 1 hasta el versículo 24"
  },

  {
    dia: 6,
    texto: "Mateo 5:25-48",
    link: "https://www.bible.com/es-ES/bible/149/MAT.5.RVR1960",
    aviso: "Continúa desde el versículo 25 hasta el versículo 48"
  }
];

let diaActual = 5;

let lectura = lecturas.find(x => x.dia === diaActual);

let avisoLectura = "";

if (lectura.aviso) {
  avisoLectura = `
    <div style="
      margin: 15px auto 25px;
      padding: 14px;
      max-width: 430px;
      background: #fff8e8;
      border: 2px solid #d6a84b;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    ">
      📌 ${lectura.aviso}
    </div>
  `;
}

document.getElementById("contenido").innerHTML = `

<div class="dia">
Día ${lectura.dia}
</div>

<div class="lectura">
📖 ${lectura.texto}
</div>

${avisoLectura}

<a class="boton" href="${lectura.link}" target="_blank">
LEER LA LECTURA DE HOY
</a>

`;

</script>
</body>
</html>
